name: Changelog na Discord
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      days:
        description: 'Zpětně za kolik dní poslat changelog'
        default: '14'
        required: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Odeslat changelog
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          PING: ${{ secrets.DISCORD_CHANGELOG_PING }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
          DAYS: ${{ github.event.inputs.days }}
        run: node .github/scripts/changelog.mjs
